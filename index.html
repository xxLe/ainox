<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AINOX</title>
<meta name="description" content="下载 AINOX：iPhone / iPad 前往 App Store，Android 前往 Google Play。">
<meta name="theme-color" content="#F0EFF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110F18" media="(prefers-color-scheme: dark)">
<script>
/*
 * AINOX 扫码中转页
 * 二维码里存的是本页网址。打开后按手机系统自动跳转：
 *   iPhone / iPad → App Store        Android → Google Play
 *   电脑等其他设备 → 留在本页，显示两个下载按钮
 * 换链接只改下面两行（页面上两个按钮会自动同步）。
 * 调试：网址后加 ?os=ios / ?os=android / ?os=other 可强制走某一支。
 */
var IOS_URL = 'https://apps.apple.com/cn/app/ainox/id6761412796';
var ANDROID_URL = 'https://play.google.com/store/apps/details?id=ai.voice.recorder';

(function () {
  var ua = navigator.userAgent || '';
  var forced = (location.search.match(/[?&]os=(ios|android|other)\b/) || [])[1];
  // iPadOS 13+ 的 Safari 自称 Macintosh，靠触点数区分
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var os = forced || (ios ? 'ios' : /Android/i.test(ua) ? 'android' : 'other');
  // 微信 / QQ 内置浏览器里打不开 Google Play：Android 上不跳转，改为提示“在浏览器打开”
  var walled = os === 'android' && /MicroMessenger|\bQQ\//i.test(ua);
  window.AINOX = { os: os, walled: walled };
  // replace 而不是 href：从商店按返回时不会又被弹回去
  if (os === 'ios') location.replace(IOS_URL);
  else if (os === 'android' && !walled) location.replace(ANDROID_URL);
})();
</script>
<style>
  :root { --ground: #F0EFF6; --surface: #FFFFFF; --ink: #16131F; --ink-2: #5B5772; --line: #DAD7E6; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #110F18; --surface: #1B1825; --ink: #EDEBF6; --ink-2: #ABA6C2; --line: #2F2B3F; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px calc(env(safe-area-inset-bottom, 0px) + 40px);
    text-align: center;
  }
  .logo { display: block; width: 104px; height: 104px; }
  h1 { margin: 14px 0 0; font-size: 30px; font-weight: 800; letter-spacing: .04em; line-height: 1.2; }
  #status { margin: 6px 0 0; min-height: 1.6em; font-size: 15px; color: var(--ink-2); }
  .stores { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 32px; }
  .store {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 13px 20px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .store b { font-size: 17px; font-weight: 600; }
  .store span { font-size: 12.5px; color: var(--ink-2); }
  .store.primary { border-color: var(--ink); background: var(--ink); color: var(--ground); }
  .store.primary span { color: inherit; opacity: .7; }
  .store:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .store:active { transform: scale(.985); }

  /* 微信 / QQ 内的提示层 */
  .wall {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 22px 24px;
    background: rgba(17, 15, 24, .93);
    color: #FFFFFF;
    text-align: right;
  }
  .wall[hidden] { display: none; }
  .wall svg { width: 76px; height: 76px; margin-right: 4px; }
  .wall-title { margin: 12px 0 0; font-size: 19px; font-weight: 600; line-height: 1.5; }
  .wall-sub { margin: 6px 0 0; font-size: 14px; opacity: .75; }
</style>
